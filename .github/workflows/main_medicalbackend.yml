name: Build and deploy JAR app to Azure Web App - medicalbackend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: medicalbackend-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven
        run: ./mvnw -B clean package -DskipTests

      - name: Upload deployable JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/*-SNAPSHOT.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: .
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DDECD2EF8C7F4964B7276BA575D39F16 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_09246353B66B437E893B35F72CD3F6F0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1125104EA2524D02885B4898FFE91FDA }}

      - name: Wait for App Service SCM stabilization
        run: sleep 90

      - name: Deploy attempt 1
        id: deploy1
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: medicalbackend
          slot-name: Production
          package: ./*.jar

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 90

      - name: Deploy attempt 2
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: medicalbackend
          slot-name: Production
          package: ./*.jar

      - name: Fail if both deploy attempts failed
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: |
          echo "Both deployment attempts failed. Check Kudu logs for details."
          exit 1

name: Build and deploy JAR app to Azure Web App - medicalbackend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: medicalbackend-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw -B clean package -DskipTests

      - name: Upload deployable JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: |
            target/*.jar
            !target/*.jar.original
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: ./artifact

      - name: Verify downloaded artifact
        run: ls -la ./artifact

      - name: Resolve JAR path
        run: |
          JAR_PATH=$(find "$GITHUB_WORKSPACE/artifact" -maxdepth 3 -type f -name "*.jar" ! -name "*.jar.original" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No deployable JAR found in artifact directory"
            ls -R "$GITHUB_WORKSPACE/artifact"
            exit 1
          fi
          echo "Using JAR: $JAR_PATH"
          echo "JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DDECD2EF8C7F4964B7276BA575D39F16 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_09246353B66B437E893B35F72CD3F6F0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1125104EA2524D02885B4898FFE91FDA }}

      - name: Wait for App Service SCM stabilization
        run: sleep 90

      - name: Deploy attempt 1
        id: deploy1
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: medicalbackend
          slot-name: Production
          package: ${{ env.JAR_PATH }}

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 90

      - name: Deploy attempt 2
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: medicalbackend
          slot-name: Production
          package: ${{ env.JAR_PATH }}

      - name: Fail if both deploy attempts failed
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: |
          echo "Both deployment attempts failed. Check Kudu logs for details."
          exit 1
